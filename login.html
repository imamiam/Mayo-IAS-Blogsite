<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Mayo's Blogsite</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="center-body">
    <div class="container login-card">
      <h2 style="font-size: 2.2rem; margin-top: 0; border: none;">Mayo's Blog Login</h2>
      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
        <p id="errorMsg" class="error"></p>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-left">
        <p>Instructor: Lee Angela Yu Garnica</p>
        <p>Information Assurance and Security</p>
      </div>
      
      <div class="footer-right">
        <p>&copy; 2026 Juliana Isabel Mayo</p>
        <p>A.Y. 2025–2026 | Father Saturnino Urios University</p>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (user === 'admin' && pass === '123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('username', user);
        localStorage.setItem('showWelcome', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('errorMsg').innerText = 'Invalid username or password!';
      }
    });
  </script>

</body>
</html>
